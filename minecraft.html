           function convertText(text, map) {
    if (!map || !map.from || !map.to) return text;
    
    
    const textChars = Array.from(text); 
    return textChars.map(char => {
        let index = map.from.indexOf(char);
        return index !== -1 ? map.to[index] : char;
    }).join("");
}
